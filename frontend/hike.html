<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Hike details and recorded information.">
    <title>Hike Details | Hiking Sensor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chango&family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="app-page" data-require-auth>
    <header class="header-section">
      <a href="index.html" class="header-section">Hiking Sensor</a>
      <nav class="main-navigation">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="chat.html">AI Assistant</a>
        <button type="button" class="nav-auth-button" data-open-auth>
          Sign in
        </button>
      </nav>
    </header>
    <main class="app-main narrow-main">
        <a class="back-link" href="dashboard.html">← Back to your hikes</a>
        <section class="panel">
            <p class="eyebrow">Hike details</p>
            <h1 id="detail-name">Hike</h1>
            <p id="detail-message" class="notice" role="status" aria-live="polite"></p>
            <dl id="hike-details" class="detail-grid"></dl>
        </section>

        <section class="panel" id="step-charts-panel" hidden>
            <h2>Every step</h2>
            <p class="muted">Each point is one detected step from this hike's saved sensor data. Hover over a chart for details.</p>
            <div id="step-charts-body">
                <ul id="step-charts-legend" class="chart-legend"></ul>
                <p id="bad-landing-summary" class="chart-summary"></p>
                <figure class="chart">
                    <figcaption>Impact acceleration</figcaption>
                    <div id="impact-chart" class="chart-plot"></div>
                </figure>
                <figure class="chart">
                    <figcaption>Knee angle at impact</figcaption>
                    <div id="angle-chart" class="chart-plot"></div>
                </figure>
            </div>
            <p id="step-charts-message" class="notice" role="status" aria-live="polite"></p>
        </section>

        <section class="panel" id="buckets-panel" hidden>
            <h2>Impact distribution</h2>
            <div id="impact-buckets"></div>
        </section>

        <section class="panel" id="minutes-panel" hidden>
            <h2>Minute by minute</h2>
            <div class="table-wrap"><table id="per-minute-table"></table></div>
        </section>

    </main>
     <footer>
      <p>Hiking Sensor</p>
      <span class="nav-account-label" data-account-label hidden>
        Signed in as <strong id="signed-in-email"></strong>
      </span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="stats.js"></script>
    <script src="hikeStorage.js"></script>
    <script src="hike-charts.js"></script>
    <script src="hike-detail.js"></script>
    <script src="auth.js" defer></script>
</body>
</html>
