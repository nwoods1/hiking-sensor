<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Connect your ESP32 and record a hike.">
    <title>Record Hike | Hiking Sensor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chango&family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="app-page" data-require-auth>
    <header class="app-header">
        <a class="brand" href="index.html">Hiking Sensor</a>
        <nav class="app-navigation" aria-label="Main navigation">
            <a href="dashboard.html">Your hikes</a>
        </nav>
    </header>
    <main class="app-main narrow-main">
        <a class="back-link" href="new-hike.html">← Edit hike name</a>
        <section class="panel">
            <p class="eyebrow">Ready when you are</p>
            <h1 id="session-hike-name">New hike</h1>
            <p id="session-created-at" class="muted"></p>
            <div class="connection-panel">
                <h2>Connect your sensor</h2>
                <p id="connection-status" class="notice" role="status" aria-live="polite">Connect to your ESP32 before starting the timer.</p>
                <button id="connect-sensor" type="button">Connect to ESP32</button>
            </div>
            <div class="timer-panel" aria-live="polite">
                <p class="eyebrow">Hike timer</p>
                <p id="hike-timer" class="timer-value">00:00:00</p>
                <p id="timer-status" class="muted">Timer has not started.</p>
            </div>
            <div class="form-actions">
                <button id="start-hike" type="button" disabled>Start hike</button>
                <button id="finish-hike" type="button" class="button-secondary" hidden>Finish hike</button>
            </div>
        </section>
    </main>
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js" defer></script>
    <script src="hike-store.js" defer></script>
    <script src="hike-flow.js" defer></script>
</body>
</html>
