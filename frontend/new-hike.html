<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Name a hike and prepare to connect your sensor.">
    <title>New Hike | Hiking Sensor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chango&family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="app-page" data-require-auth>
   <header class="header-section">
      <a href="index.html" class="header-section">Hiking Sensor</a>
      <nav class="main-navigation">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="chat.html">AI Assistant</a>
        <button type="button" class="nav-auth-button" data-open-auth>
          Sign in
        </button>
      </nav>
    </header>
    <main class="app-main narrow-main">
        <a class="back-link" href="dashboard.html">← Back to your hikes</a>
        <section class="panel">
            <p class="eyebrow">New hike</p>
            <h1>Plan your hike</h1>
            <form id="new-hike-form" class="form-stack">
                <label for="hike-name">Hike name</label>
                <input id="hike-name" name="name" type="text" maxlength="100" placeholder="e.g. Pine Ridge Loop" required>
                <label for="hike-created-at">Created</label>
                <input id="hike-created-at" name="createdAt" type="text" readonly>
                <p id="new-hike-message" class="notice" role="status" aria-live="polite"></p>
                <button type="submit">Continue to sensor connection</button>
            </form>
        </section>
    </main>
     <footer>
      <p>Hiking Sensor</p>
      <span class="nav-account-label" data-account-label hidden>
        Signed in as <strong id="signed-in-email"></strong>
      </span>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="stats.js"></script>
    <script src="hikeStorage.js"></script>
    <script src="auth.js" defer></script>
    <!-- uploads any finished hikes that failed to upload earlier -->
    <script type="module" src="hike-sync.js"></script>
    <script src="hike-flow.js" defer></script>
</body>
</html>
