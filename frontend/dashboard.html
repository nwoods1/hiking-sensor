<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Review past hikes or start a new hike.">
    <title>Your Hikes | Hiking Sensor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chango&family=Clarity+City:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
</head>
<body class="app-page" data-require-auth>
    <header class="header-section">
     <a href="index.html" class="site-logo" aria-label="Hiking Sensor home">
        <img src="../assets/logo.png" alt="Hiking Sensor" />
      </a>
      <nav class="main-navigation">
        <a href="index.html">Home</a>
        <a href="index.html">About</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="chat.html">AI Assistant</a>
        <button type="button" class="nav-auth-button" data-open-auth>
          Sign in
        </button>
      </nav>
    </header>
    <main class="app-main">
        <section class="page-intro">
            <p class="eyebrow">Your activity</p>
            <h1>Your hikes</h1>
        </section>
        <section class="panel">
            <div class="section-heading">
                <div>
                    <h2>Past hikes</h2>
                    <p class="muted">Open a hike to review its details.</p>
                </div>
                <a class="button-link" href="new-hike.html">Start a new hike</a>
            </div>
            <p id="hike-list-message" class="notice" role="status" aria-live="polite"></p>
            <div id="hike-list" class="hike-list"></div>
        </section>
        <section id="hike-detail" class="panel" hidden>
            <div class="section-heading">
                <h2 id="detail-title">Hike details</h2>
                <button type="button" id="detail-close" class="text-button">Close</button>
            </div>
            <div id="detail-stats" class="hike-list"></div>
            <!-- the graph goes here next -->
        </section>
    </main>
    <footer>
      <p>Soft Step</p>
      <p>Made by the Hacker Snackers <3</p>
      <span class="nav-account-label" data-account-label hidden>
        Signed in as <strong id="signed-in-email"></strong>
      </span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="stats.js"></script>
    <script src="hikeStorage.js"></script>
    <script src="dashboard.js"></script>
    <script src="auth.js" defer></script>
</body>
</html>
